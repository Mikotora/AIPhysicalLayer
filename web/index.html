<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AIPhysicalLayer</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">AI COMMON PHYSICAL LAYER</p>
        <h1>AIPhysicalLayer</h1>
        <p>Phase 2 · 共通操作経路のローカル操作ページ</p>
      </header>

      <section class="notice" aria-label="安全状態">
        <strong id="safety-title">接続状態を確認中…</strong>
        <span id="safety-detail">localhost限定</span>
      </section>

      <section class="panel" aria-labelledby="device-heading">
        <div class="panel-heading">
          <div>
            <p class="section-label">DEVICE</p>
            <h2 id="device-heading">リビング照明</h2>
          </div>
          <span id="adapter-badge" class="badge">確認中</span>
        </div>

        <p id="device-state" class="device-state" aria-live="polite">状態を読み込み中…</p>
        <div id="device-actions" class="actions" aria-label="照明操作"></div>
        <p id="action-result" class="result" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="log-heading">
        <div class="panel-heading">
          <div>
            <p class="section-label">AUDIT LOG</p>
            <h2 id="log-heading">直近の操作</h2>
          </div>
          <button id="refresh-logs" class="secondary" type="button">更新</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>時刻</th>
                <th>操作</th>
                <th>結果</th>
                <th>Adapter</th>
              </tr>
            </thead>
            <tbody id="log-body">
              <tr><td colspan="4">ログを読み込み中…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
